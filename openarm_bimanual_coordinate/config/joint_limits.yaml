# Joint limits for the bimanual carry demo: same velocity caps as the
# openarm_bimanual_moveit_config, plus explicit acceleration limits so the
# MoveIt time parameterization produces well-shaped trajectories.
default_velocity_scaling_factor: 0.15
default_acceleration_scaling_factor: 0.15

joint_limits:
  openarm_left_finger_joint1:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 10.0
