# KDL solver tuning for the 7-DoF arms: the stock 5 ms timeout almost never
# converges for redundant arms, which made every plan fail with
# NO_IK_SOLUTION. 0.1 s per attempt gives the random-restart solver room.
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1

right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
