controller_manager:
  ros__parameters:
    update_rate: 100  # Hz; dual-arm classic CAN stays below bus saturation

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    left_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: position_controllers/GripperActionController

    left_zero_torque_controller:
      type: openarm_hardware/ZeroTorqueController

    right_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: position_controllers/GripperActionController

    right_zero_torque_controller:
      type: openarm_hardware/ZeroTorqueController

    left_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

    right_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController


left_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

left_forward_velocity_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity

left_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7

    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      # NOTE: velocity removed from state_interfaces to prevent JTC from
      # checking velocity tolerances (stopped_velocity_tolerance=0.01 is too
      # strict for this hardware). velocity in command_interfaces is kept so
      # that cubic spline + velocity feedforward still work.

    state_publish_rate: 100.0 # Defaults to 50
    action_monitor_rate: 50.0 # Defaults to 20

    # Use measured joint state when a new goal starts.  Open-loop mode starts
    # from the previous desired target and causes the visible downward/return
    # step when the real arm has not quite reached that target.
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false   # 禁止轨迹末端带非零速度，GUI 的五次多项式轨迹本来就是零末速，不受影响

    allow_partial_joints_goal: false # Defaults to false
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 4.0 # 给重力前馈斜率限制和真机末端稳定留出时间
      # 0.04 rad is the initial work-level gate (~2.3 deg). Replace it with
      # the measured 95th-percentile value from trajectory_*.summary.json.
      openarm_left_joint1:
        goal: 0.04
      openarm_left_joint2:
        goal: 0.04
      openarm_left_joint3:
        goal: 0.04
      openarm_left_joint4:
        goal: 0.04
      openarm_left_joint5:
        goal: 0.04
      openarm_left_joint6:
        goal: 0.04
      openarm_left_joint7:
        goal: 0.04

left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    goal_tolerance: 0.002
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5


