controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    left_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: position_controllers/GripperActionController

    left_zero_torque_controller:
      type: openarm_hardware/ZeroTorqueController

    right_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: position_controllers/GripperActionController

    right_zero_torque_controller:
      type: openarm_hardware/ZeroTorqueController

    left_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

    right_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController


left_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

left_forward_velocity_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity

left_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7

    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      # NOTE: velocity removed from state_interfaces to prevent JTC from
      # checking velocity tolerances (stopped_velocity_tolerance=0.01 is too
      # strict for this hardware). velocity in command_interfaces is kept so
      # that cubic spline + velocity feedforward still work.

    state_publish_rate: 100.0 # Defaults to 50
    action_monitor_rate: 50.0 # Defaults to 20

    open_loop_control: true
    allow_nonzero_velocity_at_trajectory_end: false   # 禁止轨迹末端带非零速度，GUI 的五次多项式轨迹本来就是零末速，不受影响

    allow_partial_joints_goal: false # Defaults to false
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 2.0 # 轨迹规划结束后，允许控制器继续调整并达到目标点的额外时间（Grace Period，宽限时间）
      openarm_left_joint1:
        goal: 0.1
      openarm_left_joint2:
        goal: 0.1
      openarm_left_joint3:
        goal: 0.1
      openarm_left_joint4:
        goal: 0.1
      openarm_left_joint5:
        goal: 0.1
      openarm_left_joint6:
        goal: 0.1
      openarm_left_joint7:
        goal: 0.1

left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position


right_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

right_forward_velocity_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity

right_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7

    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      # NOTE: velocity removed from state_interfaces (same reason as left arm).

    state_publish_rate: 100.0 # Defaults to 50
    action_monitor_rate: 50.0 # Defaults to 20

    open_loop_control: true
    allow_nonzero_velocity_at_trajectory_end: false

    allow_partial_joints_goal: false # Defaults to false
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 1.0 # Defaults to 0.0 (start immediately)
      openarm_right_joint1:
        goal: 0.1
      openarm_right_joint2:
        goal: 0.1
      openarm_right_joint3:
        goal: 0.1
      openarm_right_joint4:
        goal: 0.1
      openarm_right_joint5:
        goal: 0.1
      openarm_right_joint6:
        goal: 0.1
      openarm_right_joint7:
        goal: 0.1

right_gripper_controller:
  ros__parameters:
    joint: openarm_right_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position

left_zero_torque_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    kd: 0.0
    gravity_scale: 1.05
    coriolis_scale: 1.0
    coulomb_friction: [0.3, 0.3, 0.2, 0.2, 0.1, 0.1, 0.1]
    viscous_friction: [0.1, 0.1, 0.05, 0.05, 0.02, 0.02, 0.02]
    friction_velocity_epsilon: 0.01
    tau_limits: [20.0, 20.0, 7.0, 7.0, 2.0, 2.0, 2.0]
    hold_kp: 5.0
    hold_velocity_threshold: 0.05
    hold_timeout: 0.5
    robot_description_node: controller_manager

right_zero_torque_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    kd: 0.0
    gravity_scale: 1.05
    coriolis_scale: 1.0
    coulomb_friction: [0.3, 0.3, 0.2, 0.2, 0.1, 0.1, 0.1]
    viscous_friction: [0.1, 0.1, 0.05, 0.05, 0.02, 0.02, 0.02]
    friction_velocity_epsilon: 0.01
    tau_limits: [20.0, 20.0, 7.0, 7.0, 2.0, 2.0, 2.0]
    hold_kp: 5.0
    hold_velocity_threshold: 0.05
    hold_timeout: 0.5
    robot_description_node: controller_manager

